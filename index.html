<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danial Hyatt — Product Motion Design</title>
  <meta name="description" content="Danial Hyatt — motion graphic designer crafting cinematic product motion design ads that sell. Portfolio, pricing and timelines." />

  <!-- Open Graph -->
  <meta property="og:title" content="Danial Hyatt — Product Motion Design" />
  <meta property="og:description" content="Cinematic product motion design ads that make brands move." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://danialhyatt.com" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== Loader ===== -->
  <div class="loader" id="loader">
    <div class="loader__text" aria-hidden="true">
      <span>D</span><span>A</span><span>N</span><span>I</span><span>A</span><span>L</span>
    </div>
  </div>

  <!-- ===== Top Nav ===== -->
  <header class="nav" id="nav">
    <a href="#home" class="nav__logo" aria-label="DanialH home">
      <svg class="nav__logo-svg" id="logoSvg" viewBox="0 0 170 34" width="150" height="30" aria-hidden="true">
        <g id="logoGroup" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
          <path class="logo-draw" pathLength="100" d="M0 7 L0 27 L17 17 Z" />
          <text class="logo-draw logo-word" x="26" y="27">DanialH.</text>
        </g>
      </svg>
    </a>

    <div class="nav__right">
      <div class="nav__inline">
        <a href="mailto:hello@danialhyatt.com">Contact</a>
      </div>
      <button class="nav__menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menuOverlay">
        <span class="nav__menu-icon"><span></span><span></span></span>
        <span class="nav__menu-label">Menu</span>
      </button>
    </div>
  </header>

  <!-- ===== Full menu overlay ===== -->
  <nav class="menu" id="menuOverlay" aria-label="Primary" aria-hidden="true">
    <ol class="menu__list">
      <li><a href="#home" data-num="01">Home</a></li>
      <li><a href="#reel" data-num="02">Reel</a></li>
      <li><a href="mailto:hello@danialhyatt.com" data-num="03">Contact</a></li>
    </ol>
    <div class="menu__foot">
      <a href="mailto:hello@danialhyatt.com">hello@danialhyatt.com</a>
      <div class="menu__social">
        <a href="#">Instagram</a><a href="#">Behance</a><a href="#">Vimeo</a><a href="#">LinkedIn</a>
      </div>
    </div>
  </nav>

  <!-- ===== Social rail ===== -->
  <aside class="social" aria-label="Social links">
    <a href="#" aria-label="Instagram">IG</a>
    <a href="#" aria-label="Behance">Be</a>
    <a href="#" aria-label="Vimeo">Vi</a>
    <a href="#" aria-label="LinkedIn">In</a>
    <a href="mailto:hello@danialhyatt.com" class="social__sub">Hire me</a>
  </aside>

  <main>
    <!-- ===== 01 — HERO ===== -->
    <section class="hero" id="home">
      <div class="hero__media">
        <video class="hero__video" autoplay muted loop playsinline>
          <source src="assets/video/hero.mp4" type="video/mp4" />
        </video>
        <div class="hero__scrim"></div>
      </div>

      <div class="hero__inner">
        <p class="hero__eyebrow">15&#8209;Second&nbsp;Product&nbsp;Ads</p>
        <h1 class="hero__title">MOTION</h1>
        <p class="hero__sub">Scroll&#8209;stopping 15&#8209;second product ads &mdash; built to hook in the first frame and sell by the last.</p>

        <button class="hero__play" id="reelBtn" aria-label="Play showreel">
          <span class="hero__play-icon">&#9658;</span>
          <span class="hero__play-label">Watch the<br />2024 showreel</span>
        </button>
      </div>

      <a href="#reel" class="hero__scroll" aria-label="Scroll to reel">
        <span>Featured reel</span>
        <span class="hero__chevron">&#8964;</span>
      </a>
    </section>

    <!-- ===== 02 — FEATURED REEL ===== -->
    <section class="reel" id="reel" aria-label="Featured reel">
      <div class="reel__head">
        <p class="section__label">02 — Featured</p>
        <h2 class="section__title">The&nbsp;reel</h2>
      </div>

      <button class="reel__stage" id="reelStage" aria-label="Play featured reel">
        <span class="reel__img" style="background-image:url('assets/img/reel-thumb.jpg')"></span>
        <span class="reel__scrim"></span>
        <span class="reel__play"><span class="reel__play-tri"></span></span>
        <span class="reel__meta">
          <span class="reel__meta-cat">Beauty · 15s</span>
          <span class="reel__meta-title">Valentino Uomo</span>
        </span>
        <span class="reel__time">00:15</span>
      </button>
    </section>

  </main>

  <!-- ===== Lightbox ===== -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" aria-label="Close">&times;</button>
    <div class="lightbox__frame" id="lightboxFrame"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
